<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Product | VASTRA</title><meta name="description" content="VASTRA product detail."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap"><div class="pdp" id="p"></div><div class="hd"><h2>You may also like</h2></div><div class="grid g4" id="rel" style="padding-bottom:100px"></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>const p=find(new URLSearchParams(location.search).get("id"))||PRODUCTS[0];document.title=p.name+" | VASTRA";let col=p.colors[0],sz="M";
$("#p").innerHTML=`<div class="im"><img src="img/${p.img}.webp" alt="${p.name}"></div><div><h1>${p.name}</h1><p class="pr">${inr(p.price)} &nbsp; <span class="sm">★ ${p.rating}</span></p><p>${p.desc}</p>
<p class="sm" style="margin-top:26px">Colour</p><div class="opts" id="co">${p.colors.map((c,i)=>`<button class="${i?"":"on"}">${c}</button>`).join("")}</div>
<p class="sm">Size</p><div class="opts" id="sz">${["S","M","L","XL","XXL"].map(s=>`<button class="${s==="M"?"on":""}">${s}</button>`).join("")}</div>
<p class="sm">Quantity</p><div class="opts"><select id="qt" aria-label="Quantity">${[1,2,3,4].map(n=>`<option>${n}</option>`).join("")}</select></div>
<div style="display:grid;gap:10px;margin-bottom:10px"><button class="btn dark" id="ab">Add to bag</button><button class="btn line" id="bn">Buy now</button><button class="ul" data-w="${p.id}" style="justify-self:start">Save to wishlist</button></div>
<details open><summary>Description</summary><p>${p.desc} Designed to endure, with details that reveal themselves over time.</p></details><details><summary>Fabric &amp; care</summary><p>${p.fabric}. Cool wash, dry in shade, press on reverse.</p></details><details><summary>Fit &amp; sizing</summary><p>Contemporary, true-to-size fit. Size up for a relaxed drape.</p></details><details><summary>Shipping &amp; returns</summary><p>Complimentary shipping on qualifying orders. Returns accepted within 14 days.</p></details></div>`;
const pick=(id,f)=>$$("#"+id+" button").forEach(b=>b.onclick=()=>{$$("#"+id+" button").forEach(x=>x.classList.remove("on"));b.classList.add("on");f(b.textContent)});pick("co",v=>col=v);pick("sz",v=>sz=v);
$("#ab").onclick=()=>VA.add(p.id,col,sz,+$("#qt").value);$("#bn").onclick=()=>VA.add(p.id,col,sz,+$("#qt").value);
$("#rel").innerHTML=PRODUCTS.filter(x=>x.id!==p.id).slice(0,4).map(VA.card).join("");VA.bind()</script></body></html>
