<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shop | VASTRA</title><meta name="description" content="Shirts and T-shirts from VASTRA."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap"><div class="top"><h1 id="t"></h1><p id="d"></p></div>
<div class="bar"><span class="sm">Category</span><a href="?c=all" data-c="all">All</a><a href="?c=shirts" data-c="shirts">Shirts</a><a href="?c=t-shirts" data-c="t-shirts">T-Shirts</a><a href="?c=wish" data-c="wish">Wishlist</a>
<select id="fab" aria-label="Fabric"><option value="">Fabric: all</option><option>Cotton</option><option>Linen</option><option>Silk blend</option><option>Knit</option></select>
<select id="pr" aria-label="Price"><option value="">Price: all</option><option value="4000">Under ₹4,000</option><option value="6000">Under ₹6,000</option><option value="9000">Under ₹9,000</option></select>
<select id="so" aria-label="Sort"><option value="">Sort: featured</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div>
<div class="grid g4" id="g"></div></main>
<script src="js/data.js"></script><script src="js/app.js"></script>
<script>const c=new URLSearchParams(location.search).get("c")||"all";
const T={all:["New Arrivals","The full VASTRA edit, made for the details."],shirts:["Shirts","Refined silhouettes crafted from premium fabrics, designed to move effortlessly between occasions."],"t-shirts":["T-Shirts","Everyday essentials, elevated."],wish:["Wishlist","The pieces you have saved."]}[c]||[];
$("#t").textContent=T[0];$("#d").textContent=T[1];document.title=T[0]+" | VASTRA";$$(".bar a").forEach(a=>a.classList.toggle("on",a.dataset.c===c));
function draw(){let l=PRODUCTS.filter(p=>c==="all"||(c==="wish"?VA.wish().includes(p.id):p.cat===c));
if($("#fab").value)l=l.filter(p=>p.fabric===$("#fab").value);if($("#pr").value)l=l.filter(p=>p.price<=+$("#pr").value);
if($("#so").value)l.sort((a,b)=>$("#so").value==="a"?a.price-b.price:b.price-a.price);
$("#g").innerHTML=l.length?l.map(VA.card).join(""):'<p class="empty">Nothing here yet. Adjust the filters or <a href="shop.html?c=all">view everything</a>.</p>';VA.bind()}
["fab","pr","so"].forEach(i=>$("#"+i).onchange=draw);draw()</script></body></html>
